<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SRC Portal 匿名認証テスト</title>

  <style>
    body {
      margin: 0;
      padding: 30px 16px;
      background: #f5f5f5;
      color: #111;
      font-family: Arial, "Yu Gothic", sans-serif;
    }

    .box {
      max-width: 680px;
      margin: 0 auto;
      padding: 28px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.14);
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
      text-align: center;
    }

    .description {
      line-height: 1.7;
    }

    button {
      display: block;
      width: 100%;
      max-width: 320px;
      margin: 24px auto;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #1267d6;
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: default;
    }

    pre {
      min-height: 100px;
      padding: 16px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      background: #eeeeee;
      border-radius: 9px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main class="box">
    <h1>SRC Portal 匿名認証テスト</h1>

    <p class="description">
      Firebase Authenticationの匿名認証だけを確認します。<br>
      FirestoreやSRC Portal本体には接続しません。
    </p>

    <button id="testButton" type="button">
      匿名認証をテスト
    </button>

    <pre id="result">待機中...</pre>
  </main>

  <script>
    "use strict";

    const apiKey =
      "AIzaSyAd4Uv89V4hZQyjYaR7MfalE8Oyp8ioAbc";

    const endpoint =
      "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key="
      + encodeURIComponent(apiKey);

    const button = document.getElementById("testButton");
    const result = document.getElementById("result");

    async function testAnonymousAuthentication() {
      button.disabled = true;
      result.textContent = "Googleの匿名認証APIへ接続中...";

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 15000);

      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            returnSecureToken: true
          }),
          signal: controller.signal
        });

        const responseText = await response.text();

        let responseData;

        try {
          responseData = JSON.parse(responseText);
        } catch {
          responseData = responseText;
        }

        if (response.ok) {
          result.textContent =
            "成功しました。\n\n"
            + "HTTPステータス: " + response.status + "\n"
            + "匿名ユーザーID: "
            + (responseData.localId || "取得できませんでした");

          return;
        }

        result.textContent =
          "失敗しました。\n\n"
          + "HTTPステータス: " + response.status + "\n\n"
          + "Googleからの応答:\n"
          + JSON.stringify(responseData, null, 2);

      } catch (error) {
        if (error.name === "AbortError") {
          result.textContent =
            "失敗しました。\n\n"
            + "15秒以内に応答がありませんでした。";
        } else {
          result.textContent =
            "通信処理でエラーが発生しました。\n\n"
            + String(error);
        }
      } finally {
        clearTimeout(timeoutId);
        button.disabled = false;
      }
    }

    button.addEventListener(
      "click",
      testAnonymousAuthentication
    );
  </script>
</body>
</html>
